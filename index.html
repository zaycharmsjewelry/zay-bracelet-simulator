<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZAY Charms | Build Your Bracelet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <img
      src="assets/logo.png"
      alt="ZAY Charms Jewelry"
      class="logo"
    >

    <p class="tagline">BUILD YOUR BRACELET</p>

  </header>


  <main class="container">

    <section class="intro">

      <h1>BUILD YOUR BRACELET</h1>

      <p>
        Choose your chain and create your own charm combination.
      </p>

    </section>


    <!-- BRACELET PREVIEW -->

    <section class="bracelet-section">

      <canvas
        id="braceletCanvas"
        width="1000"
        height="420"
      ></canvas>

    </section>


    <!-- CHAINS -->

    <section class="chains-section">

      <h2>CHOOSE YOUR CHAIN</h2>

      <div id="chainGrid" class="chain-grid">

        <button
          type="button"
          class="chain-card active"
          data-bracelet="1"
        >

          <img
            src="assets/bracelet-1.png"
            alt="Cable Chain"
          >

          <span class="chain-name">
            Cable Chain
          </span>

          <span class="chain-price">
            AED 15
          </span>

        </button>


        <button
          type="button"
          class="chain-card"
          data-bracelet="2"
        >

          <img
            src="assets/bracelet-2.png"
            alt="Curb Chain"
          >

          <span class="chain-name">
            Curb Chain
          </span>

          <span class="chain-price">
            AED 18
          </span>

        </button>


        <button
          type="button"
          class="chain-card"
          data-bracelet="3"
        >

          <img
            src="assets/bracelet-3.png"
            alt="Oval Link Chain"
          >

          <span class="chain-name">
            Oval Link Chain
          </span>

          <span class="chain-price">
            AED 22
          </span>

        </button>


        <button
          type="button"
          class="chain-card"
          data-bracelet="4"
        >

          <img
            src="assets/bracelet-4.png"
            alt="Paperclip Chain"
          >

          <span class="chain-name">
            Paperclip Chain
          </span>

          <span class="chain-price">
            AED 20
          </span>

        </button>

      </div>

    </section>


    <!-- CHARMS -->

    <section class="charms-section">

      <h2>CHOOSE YOUR CHARMS</h2>


      <div class="filters">

        <input
          id="search"
          type="search"
          placeholder="Search charms..."
          autocomplete="off"
        >


        <select id="categoryFilter">

          <option value="all">
            All Charms
          </option>

        </select>

      </div>


      <div
        id="charmGrid"
        class="charm-grid"
      ></div>

    </section>


    <!-- BUTTONS -->

    <section class="controls">

      <button
        id="removeBtn"
        type="button"
        >
        REMOVE
      </button>


      <button
        id="clearBtn"
        type="button"
      >
        CLEAR
      </button>


      <button
        id="saveBtn"
        type="button"
      >
        SAVE DESIGN
      </button>

    </section>


    <!-- SUMMARY -->

    <section class="summary">

      <div class="summary-row">

        <span>Chain</span>

        <strong id="braceletPriceLabel">
          Cable Chain
        </strong>

      </div>


      <div class="summary-row">

        <span>Chain Price</span>

        <strong id="braceletPrice">
          AED 15
        </strong>

      </div>


      <div class="summary-row">

        <span id="charmCountLabel">
          0 Charms
        </span>

        <strong id="charmPrice">
          AED 0
        </strong>

      </div>


      <div class="summary-row total">

        <span>TOTAL</span>

        <strong id="totalPrice">
          AED 15
        </strong>

      </div>


      <p class="delivery-note">
        Delivery charges are calculated separately.
      </p>


      <p
        id="selectedList"
        class="selected-list"
      >
        No charms selected yet.
      </p>

    </section>

  </main>


  <!-- IMPORTANT: charms.js MUST load before script.js -->

  <script src="charms.js"></script>
  <script src="script.js"></script>

</body>
</html>
