<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZAY Charms - Build Your Bracelet</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <img
      src="assets/logo.png"
      alt="ZAY Charms"
      class="logo"
    >

    <p class="tagline">
      BUILD YOUR BRACELET
    </p>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- =========================
         BRACELET BUILDER
    ========================== -->

    <section class="builder-section">

      <div class="section-heading">

        <h1>
          BUILD YOUR BRACELET
        </h1>

        <p>
          Choose your chain and add your favourite charms.
        </p>

      </div>


      <!-- =========================
           BRACELET CANVAS
      ========================== -->

      <div class="bracelet-wrapper">

        <canvas
          id="braceletCanvas"
          width="1000"
          height="420"
        ></canvas>

      </div>


      <!-- =========================
           CHAIN SELECTION
      ========================== -->

      <div class="chain-section">

        <h2>
          CHOOSE YOUR CHAIN
        </h2>

        <div
          id="chainGrid"
          class="chain-grid"
        ></div>

      </div>


      <!-- =========================
           CHARM SELECTION
      ========================== -->

      <div class="charms-section">

        <h2>
          CHOOSE YOUR CHARMS
        </h2>


        <!-- SEARCH + CATEGORY -->

        <div class="filters">

          <input
            id="search"
            type="search"
            placeholder="Search charms..."
            autocomplete="off"
          >

          <select
            id="categoryFilter"
          >

            <option value="all">
              All Charms
            </option>

          </select>

        </div>


        <!-- CHARM GRID -->

        <div
          id="charmGrid"
          class="charm-grid"
        ></div>

      </div>


      <!-- =========================
           CONTROLS
      ========================== -->

      <div class="builder-controls">

        <button
          id="removeBtn"
          type="button"
        >
          REMOVE
        </button>

        <button
          id="clearBtn"
          type="button"
        >
          CLEAR
        </button>

        <button
          id="saveBtn"
          type="button"
        >
          SAVE DESIGN
        </button>

      </div>


      <!-- =========================
           PRICE SUMMARY
      ========================== -->

      <div class="summary">

        <div class="summary-row">

          <span>
            Chain
          </span>

          <span id="chainPrice">
            AED 15
          </span>

        </div>


        <div class="summary-row">

          <span>
            Charms
          </span>

          <span id="charmsPrice">
            AED 0
          </span>

        </div>


        <div class="summary-row total-row">

          <span>
            TOTAL
          </span>

          <span id="totalPrice">
            AED 15
          </span>

        </div>


        <p class="delivery-note">
          Delivery charges are calculated separately.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script src="charms.js"></script>

  <script src="script.js"></script>

</body>

</html>
